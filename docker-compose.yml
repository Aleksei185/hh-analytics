services:
  postgres:
    image: postgres:15
    container_name: hh_postgres
    environment:
      POSTGRES_USER: hh_user
      POSTGRES_PASSWORD: hh_password
      POSTGRES_DB: hh_analytics
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hh_user"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: hh_redis
    ports:
      - "6379:6379"

  superset:
    image: apache/superset:latest
    container_name: hh_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "hh_analytics_secret_key_2026"
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      - postgres
      - redis
    volumes:
      - superset_data:/app/superset_home

volumes:
  postgres_data:
  superset_data:
